name: Build F-Droid Repo
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate F-Droid Repository
        uses: brianreumere/fdroid-repo-action@v1
        with:
          repo-name: "Sesli İlaç Asistanı Repo"
          repo-description: "iblah60 resmi F-Droid deposu"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: repo
      - uses: actions/deploy-pages@v4
